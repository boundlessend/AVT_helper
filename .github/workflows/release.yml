name: Release DMG

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Build release DMG
    runs-on: macos-15
    timeout-minutes: 40
    # право записи нужно только публикации релиза, и это единственный job workflow
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          # иначе токен остаётся в .git/config и доступен любому шагу сборки
          persist-credentials: false

      - name: Check changelog entry
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="${GITHUB_REF_NAME#v}"
          version="${version#.}"
          # -F, иначе точки версии в grep означают любой символ и заголовок соседней версии сойдёт за нужный
          if ! grep -qF "## [${version}]" CHANGELOG.md; then
            echo "CHANGELOG.md has no '## [${version}]' section for tag ${GITHUB_REF_NAME}" >&2
            exit 1
          fi

      - name: Lint (swift-format)
        run: ./scripts/lint.sh

      - name: Test
        run: swift test

      - name: Build DMG
        run: ./scripts/build_dmg.sh

      - name: Validate Info.plist
        run: plutil -lint .build/AVT_helper.app/Contents/Info.plist

      - name: Check bundle version against the tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="${GITHUB_REF_NAME#v}"
          version="${version#.}"
          plist=".build/AVT_helper.app/Contents/Info.plist"
          # версия бандла выводится из git внутри build_app.sh, поэтому расхождение с тегом ловим здесь
          bundle_version="$(plutil -extract CFBundleShortVersionString raw -o - "${plist}")"
          stage="$(plutil -extract AVTBuildStage raw -o - "${plist}")"
          if [ "${bundle_version}" != "${version}" ]; then
            echo "the bundle says version ${bundle_version}, the tag says ${version}" >&2
            exit 1
          fi
          if [ "${stage}" != "release" ]; then
            echo "the bundle is marked ${stage}, not release: the checkout is not exactly on the tag or the tree is dirty" >&2
            exit 1
          fi

      - name: Checksum
        run: shasum -a 256 AVT_helper.dmg > AVT_helper.dmg.sha256
        working-directory: .build

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: AVT_helper.dmg
          path: |
            .build/AVT_helper.dmg
            .build/AVT_helper.dmg.sha256

      - name: Collect release notes
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="${GITHUB_REF_NAME#v}"
          version="${version#.}"
          awk -v heading="## [${version}]" '
            index($0, heading) == 1 { inside = 1; next }
            inside && /^## \[/ { exit }
            inside { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          test -s RELEASE_NOTES.md

      - name: Upload DMG to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          body_path: RELEASE_NOTES.md
          files: |
            .build/AVT_helper.dmg
            .build/AVT_helper.dmg.sha256
