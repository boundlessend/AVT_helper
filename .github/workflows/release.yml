name: Release DMG

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Build release DMG
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Cache SwiftPM
        uses: actions/cache@v5
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Check changelog entry
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="${GITHUB_REF_NAME#v}"
          version="${version#.}"
          if ! grep -q "^## \[${version}\]" CHANGELOG.md; then
            echo "CHANGELOG.md has no '## [${version}]' section for tag ${GITHUB_REF_NAME}" >&2
            exit 1
          fi

      - name: Lint (swift-format)
        run: |
          if swift format --version >/dev/null 2>&1; then
            swift format lint --strict --recursive Sources Tests
          else
            brew install swift-format
            swift-format lint --strict --recursive Sources Tests
          fi

      - name: Test
        run: swift test

      - name: Build DMG
        run: ./scripts/build_dmg.sh

      - name: Checksum
        run: shasum -a 256 AVT_helper.dmg > AVT_helper.dmg.sha256
        working-directory: .build

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: AVT_helper.dmg
          path: |
            .build/AVT_helper.dmg
            .build/AVT_helper.dmg.sha256

      - name: Upload DMG to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            .build/AVT_helper.dmg
            .build/AVT_helper.dmg.sha256
