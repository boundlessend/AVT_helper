name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build macOS app
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check changelog section
        run: |
          if ! grep -q '^## \[Unreleased\]' CHANGELOG.md; then
            echo "CHANGELOG.md has no '## [Unreleased]' section; the release workflow renames it into the tag heading" >&2
            exit 1
          fi

      - name: Check the tests named in AGENTS.md
        run: |
          for name in $(grep -oE '\btest[A-Z][A-Za-z0-9_]*' AGENTS.md | sort -u); do
            if ! grep -qE "func ${name}\(" Tests/AVT_helperTests/*.swift; then
              echo "AGENTS.md names a test that no longer exists: ${name}" >&2
              exit 1
            fi
          done

      - name: Swift version
        run: swift --version

      - name: Lint (swift-format)
        run: |
          if swift format --version >/dev/null 2>&1; then
            swift format lint --strict --recursive Sources Tests
          else
            brew install swift-format
            swift-format lint --strict --recursive Sources Tests
          fi

      - name: Build
        run: swift build -c release

      - name: Test
        run: swift test

      - name: Build app bundle and DMG
        run: ./scripts/build_dmg.sh

      - name: Validate Info.plist
        run: plutil -lint .build/AVT_helper.app/Contents/Info.plist

      - name: Upload app artifact
        uses: actions/upload-artifact@v7
        with:
          name: AVT_helper.app
          path: .build/AVT_helper.app
