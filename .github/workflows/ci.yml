name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build macOS app (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    # macos-14 в матрице нет намеренно: на этом образе тулчейн по умолчанию Swift 5.10,
    # где нет ни swift format, ни языкового режима 6, и падает он не на коде, а на самом себе.
    # macos-latest сторожит будущий образ и не валит прогон, пока тот не станет основным
    continue-on-error: ${{ matrix.os == 'macos-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Check changelog section
        run: |
          if ! grep -q '^## \[Unreleased\]' CHANGELOG.md; then
            echo "CHANGELOG.md has no '## [Unreleased]' section; the release workflow renames it into the tag heading" >&2
            exit 1
          fi

      - name: Check the tests named in AGENTS.md
        run: |
          # пустой grep не выполняет тело цикла и молча проходит, поэтому имена сначала считаем
          names="$(grep -oE '\btest[A-Z][A-Za-z0-9_]*' AGENTS.md | sort -u || true)"
          count="$(printf '%s' "${names}" | grep -c . || true)"
          if [ "${count}" -lt 10 ]; then
            echo "AGENTS.md names only ${count} tests; the table of invariants is gone and this guard checks nothing" >&2
            exit 1
          fi
          for name in ${names}; do
            if ! grep -qE "func ${name}\(" Tests/AVT_helperTests/*.swift; then
              echo "AGENTS.md names a test that no longer exists: ${name}" >&2
              exit 1
            fi
          done

      - name: Swift version
        run: swift --version

      - name: Lint (swift-format)
        run: ./scripts/lint.sh

      - name: Build
        run: swift build -c release

      - name: Test
        run: swift test

      - name: Build app bundle and DMG
        if: matrix.os == 'macos-15'
        run: ./scripts/build_dmg.sh

      - name: Validate Info.plist
        if: matrix.os == 'macos-15'
        run: plutil -lint .build/AVT_helper.app/Contents/Info.plist

      - name: Pack app bundle
        if: matrix.os == 'macos-15'
        # upload-artifact пакует каталог в zip без прав доступа, и распакованный бандл не запускается
        run: ditto -c -k --keepParent .build/AVT_helper.app .build/AVT_helper.app.zip

      - name: Upload app artifact
        if: matrix.os == 'macos-15'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: AVT_helper-app
          path: .build/AVT_helper.app.zip
